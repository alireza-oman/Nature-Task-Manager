{% extends "base.html" %}

{% block title %}Sign In - Nature Task Manager{% endblock %}
{% block container_class %}container-narrow{% endblock %}

{% block content %}
<header style="text-align: center;">
    <h1>Welcome Back</h1>
    <p>Please sign in to your account</p>
</header>

<div class="form-section">
    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="Your username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Your password" required>
        </div>

        <div class="form-group" style="display: flex; align-items: center;">
            <label style="display: flex; align-items: center; cursor: pointer; font-size: 0.9rem; margin: 0;">
                <input type="checkbox" name="remember" style="width: auto; margin-right: 8px;"> Remember me
            </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Sign In</button>
    </form>

    <div style="text-align: center; margin-top: 15px;">
        <a href="{{ url_for('register') }}" style="color: var(--secondary-color); font-size: 0.9rem; text-decoration: none;">Don't have an account? Sign Up</a>
    </div>
</div>
{% endblock %}
