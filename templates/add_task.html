{% extends "base.html" %}

{% block title %}Add Task - Nature Task Manager{% endblock %}

{% block content %}
<header>
    <h2>+ Add New Task</h2>
</header>

<div class="form-content">
    <form action="{{ url_for('add') }}" method="POST">
        <div class="form-group">
            <label for="title">Task Title</label>
            <input type="text" id="title" name="title" class="form-control" placeholder="e.g., Morning Jog in the park" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control" placeholder="Add some notes..."></textarea>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" class="form-control">
                <option value="personal" selected>🌱 Personal</option>
                <option value="work">💼 Work</option>
                <option value="study">📚 Study</option>
                <option value="shopping">🛒 Shopping</option>
                <option value="fitness">🏃 Fitness</option>
            </select>
        </div>

        <div class="form-group">
            <label for="date">Due Date</label>
            <input type="date" id="date" name="date" class="form-control">
        </div>

        <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority" name="priority" class="form-control">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="is_pinned" name="is_pinned" style="width: 18px; height: 18px; accent-color: var(--primary-color);">
            <label for="is_pinned" style="margin: 0; cursor: pointer;">★ Pin to top of list</label>
        </div>

        <div class="btn-group" style="display: flex; gap: 10px; margin-top: 20px;">
            <a href="{{ url_for('home') }}" class="btn btn-cancel" style="flex: 1;">Cancel</a>
            <button type="submit" class="btn btn-submit" style="flex: 1;">Create Task</button>
        </div>
    </form>
</div>
{% endblock %}
