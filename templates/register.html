{% extends "base.html" %}

{% block title %}Sign Up - Nature Task Manager{% endblock %}
{% block container_class %}container-narrow{% endblock %}

{% block content %}
<header style="text-align: center;">
    <h1>Create Account</h1>
    <p>Join us to manage your tasks</p>
</header>

<div class="form-section">
    <form action="{{ url_for('register') }}" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Create a password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Sign Up</button>
    </form>

    <div style="text-align: center; margin-top: 15px;">
        <a href="{{ url_for('login') }}" style="color: var(--secondary-color); font-size: 0.9rem; text-decoration: none;">Already have an account? Log In</a>
    </div>
</div>
{% endblock %}
